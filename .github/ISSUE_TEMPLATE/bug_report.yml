name: "🐛 Bug Report"
description: 报告一个 JobRadar 的 bug
title: "[bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 感谢你帮 JobRadar 变得更稳（真正的产品从第一批用户开始）。
  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      placeholder: 描述你看到的问题
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望什么
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 …
        2. 点击 …
        3. 看到 …
  - type: input
    id: env
    attributes:
      label: 环境
      placeholder: Android / Web / 版本
