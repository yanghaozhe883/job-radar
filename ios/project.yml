name: JobRadar
options:
  bundleIdPrefix: com.jobradar
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    DEVELOPMENT_TEAM: ""
targets:
  JobRadar:
    type: application
    platform: iOS
    sources:
      - path: JobRadar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jobradar.app
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_STRICT_CONCURRENCY: complete
    scheme:
      testTargets:
        - JobRadarTests
  JobRadarTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: JobRadarTests
    dependencies:
      - target: JobRadar
